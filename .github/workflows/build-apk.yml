name: Build style-tags APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (your fork, with the patch already applied/committed)
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests (TextTransformerTest only — the project's own
          pre-existing Robolectric-based tests need an Android SDK stub
          setup this generic CI doesn't provide, and are unrelated to
          this feature)
        run: ./gradlew testDebugUnitTest --tests "helium314.keyboard.tags.TextTransformerTest" --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: heliboard-style-tags-debug-apk
          path: app/build/outputs/apk/debug/*.apk
